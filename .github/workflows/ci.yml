name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run for the same ref, except on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege. No job here writes anything.
permissions:
  contents: read

jobs:
  check:
    name: typecheck + scrub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:scrub

  license-headers:
    name: license headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Verifies every first-party source file carries the Apache 2.0 header.
      # Self-contained Node script, so no install step. Run `npm run license:fix`
      # locally to add missing headers.
      - run: node scripts/license-header.mjs check

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not hide the others: the daemon behaves
      # differently on each, which is the whole reason for the matrix.
      fail-fast: false
      matrix:
        # PRs get a cheap spread; main gets the full grid. Node 20.11 is the floor
        # (first LTS with import.meta.dirname), so 20 must stay in the matrix.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # No test binds a privileged port: the daemon's listen address is
      # configuration, so every case runs unprivileged everywhere.
      - run: npm test

  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Build only, never deploy. Docs breakage is caught here, on the pull request,
      # rather than when docs.yml tries to publish it.
      # fetch-depth: 0 for the `v*` tags the version label is derived from.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  package:
    name: package shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # publint + are-the-types-wrong against a real `npm pack`. This is the gate
      # that catches an exports map pointing at declaration files the build does
      # not actually emit.
      - run: npm run check:pkg
      - name: tarball size guard
        # Catches an accidental src/ or fixtures/ inclusion, which is also how
        # internal material would leak into a published artifact.
        run: |
          size=$(npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].size))')
          echo "packed size: $size bytes"
          # Generous on purpose. This guards against an accidental src/ or fixtures/
          # inclusion - which is also how internal material would leak into a
          # published artifact - not against byte growth. The current ~283 KB is
          # mostly library sourcemaps, which are legitimate.
          if [ "$size" -gt 600000 ]; then
            echo "::error::tarball is larger than 600 KB; check the files field"
            exit 1
          fi

