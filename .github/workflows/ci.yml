name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run for the same ref, except on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:scrub

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the others: the daemon behaves
      # differently on each, which is the whole reason for the matrix.
      fail-fast: false
      matrix:
        # PRs get a cheap spread; main gets the full grid. Node 20.11 is the floor
        # (first LTS with import.meta.dirname), so 20 must stay in the matrix.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # No test binds a privileged port: the daemon's listen address is
      # configuration, so every case runs unprivileged everywhere.
      - run: npm test

  package:
    name: package shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # publint + are-the-types-wrong against a real `npm pack`. This is the gate
      # that catches an exports map pointing at declaration files the build does
      # not actually emit.
      - run: npm run check:pkg
      - name: tarball size guard
        # Catches an accidental src/ or fixtures/ inclusion, which is also how
        # internal material would leak into a published artifact.
        run: |
          size=$(npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].size))')
          echo "packed size: $size bytes"
          if [ "$size" -gt 300000 ]; then
            echo "::error::tarball is larger than 300 KB; check the files field"
            exit 1
          fi

  changeset:
    name: changeset present
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Look for a changeset
        # A warning, never a failure. Blocking a first-time contributor on release
        # bookkeeping they have never heard of is hostile; a maintainer can add one.
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^\.changeset/.*\.md$'; then
            echo "changeset found"
          else
            echo "::warning::No changeset in this PR. Run 'npm run changeset' if this is a user-visible change."
          fi
