name: Docs

# Manual rebuilds of the docs site between releases, for a typo fix or a new page that
# should not wait for a version bump. Release-time deploys are not here: they would race
# two workflows on the same github-pages environment.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time. `cancel-in-progress: false` lets an in-flight
# deploy finish rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 for the `v*` tags the version label is derived from, and for the
      # git timestamps behind "last updated".
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
